<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login con Entra ID</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <!-- Estado inicial: cargando -->
  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <p>Verificando sesión...</p>
  </div>

  <!-- No autenticado -->
  <div id="loginState" class="container hidden">
    <div class="card">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="8" fill="#0078d4"/>
          <path d="M14 14h9v9h-9V14ZM25 14h9v9h-9V14ZM14 25h9v9h-9V25ZM25 25h9v9h-9V25Z" fill="#fff"/>
        </svg>
      </div>
      <h1>MVP Login Entra ID</h1>
      <p>Iniciá sesión con tu cuenta de Microsoft para acceder a la aplicación.</p>
      <button id="btnLogin" class="btn-primary">Iniciar sesión</button>
    </div>
  </div>

  <!-- Modal de login (redirigiendo a Microsoft) -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Iniciar sesión</h2>
      </div>
      <div class="modal-body">
        <p>Redirigiendo a Microsoft Entra ID...</p>
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- Autenticado -->
  <div id="userInfo" class="user-info hidden">
    <div class="avatar" id="userAvatar">?</div>
    <h2 id="displayName"></h2>
    <div class="user-details">
      <div class="detail-row">
        <span class="detail-label">Email</span>
        <span class="detail-value" id="userEmail"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Usuario</span>
        <span class="detail-value" id="userName"></span>
      </div>
    </div>
    <button id="btnLogout" class="btn-secondary">
      <span class="btn-text">Cerrar sesión</span>
      <span class="btn-spinner hidden"></span>
    </button>
  </div>

  <!-- Error -->
  <div id="errorMessage" class="error hidden">
    <span id="errorText"></span>
    <button id="btnDismissError" class="btn-dismiss">&times;</button>
  </div>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
